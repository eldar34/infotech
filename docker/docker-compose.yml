name: "${COMPOSE_PROJECT_NAME:-tech-local}"
services:
    app-php:
        build:
            context: ./conf/php
        container_name: ${CONTAINER_NAME:-techlocal}-app
        restart: ${CONTAINER_MODE:-unless-stopped}
        user: "${UID:-0}:${GID:-0}" 
        expose:
            - "9000"
        working_dir: /var/www/tech.local
        volumes:
            - ./../:/var/www/tech.local
        depends_on:
            - db
        extra_hosts:
           - "host.docker.internal:host-gateway"
        networks:
            - techlocal_network 
    nginx:
        image: nginx:1.29.3-alpine
        container_name: ${CONTAINER_NAME:-techlocal}-nginx
        restart: ${CONTAINER_MODE:-unless-stopped}
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - ./../:/var/www/tech.local
            - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app-php
        networks:
            - techlocal_network    
    db:
        image: 'mysql:8.4' 
        container_name: ${CONTAINER_NAME:-techlocal}-db
        restart: ${CONTAINER_MODE:-unless-stopped}
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}' 
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - '${DB_DATA_STORAGE}:/var/lib/mysql'
        ports:
            - '${DB_PORT:-3306}:3306'
        networks:
            - techlocal_network

networks:
  techlocal_network:
    driver: bridge
